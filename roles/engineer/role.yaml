name: engineer
version: "0.2"
title: Software Engineer
department: Programming
description: Implements a well-scoped change in the project, with tests, and hands it off for review.
runtime: { preferred: claude, fallback: [codex, opencode] }
model: { default: claude-opus-5-5, effort: high }
soul: soul.md
rules: rules.md
permissions:
  preset: workspace-write
  deny: ["Bash(git push*)"]
kits:
  default: [handoff, guardrails]
  optional: [code-review]
memory:
  read: ["studio/", "projects/{project}/", "staff/{staff}/"]
  write: ["staff/{staff}/", "projects/{project}/inbox/"]
game:
  points: [tech, polish]
  categories: [coding, debugging]
